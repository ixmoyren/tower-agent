[package]
name = "coreutils-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "uutils/coreutils 的 multicall wasm 工具组件（argv[0] 分发），当 codemode 的命令层用。"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "coreutils"
path = "src/main.rs"

# 上游 0.12 线。升级 = 改这里的版本 + 跑 generate.sh，见 README「升级与扩容」。
# 注：crates.io 上的 uu_* / uucore 声明 MIT（各自带 LICENSE 文件），因此可以内嵌进本仓库
# 的 MIT OR Apache-2.0 产物；上游仓库整体是另一个许可，发布前值得再确认一次。
[dependencies]
uucore = "0.12"

# 文本处理
uu_cat = "0.12"
uu_head = "0.12"
uu_tail = "0.12"
uu_tac = "0.12"
uu_nl = "0.12"
uu_fold = "0.12"
uu_expand = "0.12"
uu_unexpand = "0.12"
uu_od = "0.12"
uu_cut = "0.12"
uu_tr = "0.12"
uu_uniq = "0.12"
uu_comm = "0.12"
uu_join = "0.12"
uu_paste = "0.12"
uu_split = "0.12"
uu_shuf = "0.12"
uu_tsort = "0.12"
uu_sort = "0.12"
uu_wc = "0.12"
uu_seq = "0.12"

# 文件 / 路径
uu_ls = "0.12"
uu_cp = "0.12"
uu_mv = "0.12"
uu_rm = "0.12"
uu_mkdir = "0.12"
uu_touch = "0.12"
uu_mktemp = "0.12"
uu_dirname = "0.12"
uu_basename = "0.12"
uu_realpath = "0.12"
uu_readlink = "0.12"
uu_ln = "0.12"
uu_link = "0.12"
uu_unlink = "0.12"
uu_truncate = "0.12"

# 杂项
uu_true = "0.12"
uu_false = "0.12"
uu_echo = "0.12"
uu_printf = "0.12"
uu_test = "0.12"
uu_expr = "0.12"
uu_date = "0.12"
uu_sleep = "0.12"
uu_tee = "0.12"
uu_yes = "0.12"
uu_pwd = "0.12"
uu_numfmt = "0.12"
uu_factor = "0.12"
uu_printenv = "0.12"

# 校验 / 编码
uu_md5sum = "0.12"
uu_sha1sum = "0.12"
uu_sha256sum = "0.12"
uu_sha512sum = "0.12"
uu_b2sum = "0.12"
uu_cksum = "0.12"
uu_sum = "0.12"
uu_base64 = "0.12"
uu_base32 = "0.12"
uu_basenc = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 独立 workspace：只以 wasm32-wasip2 为目标构建，不进主 workspace。
[workspace]
