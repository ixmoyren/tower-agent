[package]
name = "rquickjs-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Wasm component sandbox that embeds the rquickjs JavaScript engine (built with cargo-component)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["full-async-wasi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 独立 workspace：只以 wasm32-wasip2 为目标构建，不进主 workspace。
[workspace]
