[package]
name = "monty-sandbox"
version = "0.1.0"
edition = "2024"
description = "Wasm component sandbox that embeds the monty interpreter (built with cargo-component)."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
monty = "1.1.0"
monty-types = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

# 独立 workspace：它只以 wasm32-wasip2 为目标构建，不能进主 workspace。
[workspace]
