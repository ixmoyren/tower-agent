[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tower = { version = "0.5.3", features = ["util", "timeout", "retry", "limit", "load-shed", "steer", "filter", "buffer"] }
base64 = "0.23"
dirs = "7"
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.31", default-features = false, features = ["signal"] }
regex = "1"
similar = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", default-features = false }
unicode-normalization = "0.1"
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
