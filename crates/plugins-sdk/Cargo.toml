[package]
name = "plugins-sdk"
description = "tower-pi-agent plugin author SDK: declare_plugin!, HostApi handle, tool registration."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agent = { path = "../agent" }
plugins = { path = "../plugins" }
semver = { workspace = true }
stabby = { version = "72.1.16", optional = true }

[features]
default = []
# 动态插件作者需要的 ABI 类型 + `declare_dynamic_plugin!`。
dynamic = ["plugins/dynamic", "dep:stabby"]
