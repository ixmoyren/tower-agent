[package]
name = "tower-agent-plugins"
description = "tower-agent plugin/extension host: kinds, capability registry, dependency/version resolution."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
tower-agent-tools = { workspace = true }
# 只被本 crate 使用。
libloading = { version = "0.9.0", optional = true }
semver = { workspace = true }
stabby = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tower = { workspace = true }

[features]
default = ["static"]
static = []
# 动态插件（stabby cdylib + libloading）开关；热重载插件见 `tower-agent-monty`。
dynamic = ["dep:stabby", "dep:libloading", "dep:rkyv", "dep:serde_json"]

[dev-dependencies]
futures-util = { workspace = true }
tower-agent-provider = { workspace = true }
tokio = { workspace = true }
