[package]
name = "tower-agent-provider"
description = "tower-agent provider: pi `ai` request/stream boundary built on tower."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# 仅供测试使用的确定性离线 provider（`provider::faux`）。由消费者的
# `[dev-dependencies]` 打开，正常构建不会编进任何二进制。
test-util = []

[dependencies]
tower = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
# 只被本 crate 使用：放在这里而不是 workspace。
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "charset", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
