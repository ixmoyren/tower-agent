[package]
name = "tower-agent-monty"
description = "tower-agent hot-reloadable mods host: embedded monty (Python-subset) sandbox plugins."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# 内部子 crate。
tower-agent-core = { workspace = true }
tower-agent-plugins = { workspace = true, features = ["dynamic"] }
tower-agent-provider = { workspace = true }
tower-agent-runtime = { workspace = true }
# 外部依赖（2 个及以上 crate 使用）。
dirs = { workspace = true }
futures-util = { workspace = true }
rkyv = { workspace = true }
schemars = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
# 只被本 crate 使用。
monty-fs = "1.1.0"
monty-types = "1.1.0"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "component-model", "cache", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = { workspace = true }
