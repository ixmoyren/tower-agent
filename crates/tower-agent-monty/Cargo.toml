[package]
name = "tower-agent-monty"
description = "tower-agent hot-reloadable mods host: embedded monty (Python-subset) sandbox plugins."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dirs.workspace = true
futures-util.workspace = true
schemars.workspace = true
semver = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tower.workspace = true
tower-agent-core = { version = "0.1.0", path = "../tower-agent-core" }
tower-agent-plugins = { version = "0.1.0", path = "../tower-agent-plugins" }
tower-agent-provider = { version = "0.1.0", path = "../tower-agent-provider" }
tower-agent-runtime = { version = "0.1.0", path = "../tower-agent-runtime" }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "component-model", "cache", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
