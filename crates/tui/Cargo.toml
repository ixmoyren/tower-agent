[package]
name = "tui"
description = "Rust port of pi's `tui` package: differential terminal rendering driven by the agent event stream."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agent = { path = "../agent" }
ai = { path = "../ai" }
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "termina", "layout-cache", "macros", "underline-color"] }
serde_json = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }
