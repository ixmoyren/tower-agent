[package]
name = "tower-agent-plugin"
description = "Provider-agnostic tower-agent plugin host: kinds, registry, dependency/version resolution, and lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
libloading = { version = "0.9.0", optional = true }
semver = { workspace = true }
stabby = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tower = { workspace = true }

[features]
default = ["static"]
static = []
dynamic = ["dep:stabby", "dep:libloading", "dep:rkyv", "dep:serde_json"]

[dev-dependencies]
futures-util = { workspace = true }
tokio = { workspace = true }
tower-agent-provider.workspace = true
