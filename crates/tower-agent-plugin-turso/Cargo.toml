[package]
name = "tower-agent-plugin-turso"
description = "tower-agent default storage plugin: embedded Turso (SQLite-compatible) implementing the plugin-sdk storage contracts."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-plugin-sdk = { workspace = true, features = ["storage"] }
dirs = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

turso = { version = "0.8.3", default-features = false, features = ["fts"] }

jieba-rs = "0.11"
stop-words = "0.10"
unicode-segmentation = "1"
waken_snowball = "0.1"
whichlang = "0.1"

[dev-dependencies]
tower-agent-provider = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
