[package]
name = "tower-agent-cli"
description = "tower-agent CLI entry point (pi `packages/coding-agent` reference implementation)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tower-agent"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["codemode", "codemode-python", "codemode-js"]
# codemode 的共享入口，不引入具体解释器。
codemode = ["dep:tower-agent", "tower-agent/codemode"]
# Python（monty）解释器。
codemode-python = [
    "codemode",
    "tower-agent/codemode-python",
    "dep:tower-agent-monty",
]
# JavaScript（rquickjs）解释器。
codemode-js = [
    "codemode",
    "tower-agent/codemode-js",
    "dep:tower-agent-codemode",
]

[dependencies]
tower-agent = { workspace = true, default-features = false, optional = true }
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-plugins = { workspace = true }
tower-agent-tui = { workspace = true }
tower-agent-monty = { workspace = true, optional = true }
tower-agent-codemode = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tower = { workspace = true }
tower-agent-storage.workspace = true
tower-agent-turso.workspace = true
tower-agent-codemode-core.workspace = true

[dev-dependencies]
tower-agent-provider = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
