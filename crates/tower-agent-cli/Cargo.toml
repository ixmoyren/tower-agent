[package]
name = "tower-agent-cli"
description = "tower-agent CLI entry point (pi `packages/coding-agent` reference implementation)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tower-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-plugins = { workspace = true }
tower-agent-tui = { workspace = true }
tower-agent-monty = { workspace = true }
# 只被本 crate 使用。
clap = { version = "4.6", features = ["derive"] }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

[dev-dependencies]
tower-agent-provider = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
