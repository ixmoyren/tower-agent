[package]
name = "tower-agent-cli"
description = "tower-agent CLI entry point (pi `packages/coding-agent` reference implementation)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tower-agent"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["codemode", "jit", "monty", "rquickjs"]
codemode = ["tower-agent/codemode"]
jit = ["tower-agent/jit"]
monty = [
    "codemode",
    "jit",
    "tower-agent/monty",
    "dep:tower-agent-plugin-monty",
]
rquickjs = [
    "codemode",
    "jit",
    "tower-agent/rquickjs",
    "dep:tower-agent-plugin-rquickjs",
]

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-plugin = { workspace = true }
tower-agent-plugin-sdk = { workspace = true, features = ["codemode", "dynamic", "jit", "provider", "storage"] }
tower-agent-tui = { workspace = true }
tower-agent-plugin-monty = { workspace = true, optional = true }
tower-agent-plugin-rquickjs = { workspace = true, optional = true }
clap = { version = "4.6", features = ["derive"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tower = { workspace = true }
tower-agent-plugin-turso.workspace = true
tower-agent-plugin-ui.workspace = true
tower-agent = { workspace = true, default-features = false }
dirs.workspace = true
toml = "1.1.8"

[dev-dependencies]
semver.workspace = true
tempfile = { workspace = true }
tower-agent-plugin-providers = { workspace = true, features = ["test-util"] }
