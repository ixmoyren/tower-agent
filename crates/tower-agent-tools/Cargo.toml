[package]
name = "tower-agent-tools"
description = "tower-agent built-in tools (pi `coding-agent` core/tools)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
# 只被本 crate 使用：放在这里而不是 workspace。
base64 = "0.23"
dirs = { workspace = true }
futures-util = { workspace = true }
globset = "0.4"
ignore = "0.4"
regex = "1.13"
serde_json = { workspace = true }
similar = "3.2"
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
unicode-normalization = "0.1"

# 只在类 Unix 平台用于杀掉整个进程组（见 `shell.rs` 的 `kill_process_group`）。
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }
