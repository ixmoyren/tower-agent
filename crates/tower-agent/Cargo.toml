[package]
name = "tower-agent"
description = "tower-agent: a tower-native agent framework (core + runtime + provider + tools + plugins)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = [
    "sandbox-wasmtime",
    "codemode",
    "codemode-python",
    "codemode-js",
    "storage-turso",
]
# 可选的前端无关 UI 会话插件 / 协议 / 插件 SDK。
ui = ["dep:tower-agent-ui"]
protocol = ["dep:tower-agent-protocol"]
plugin-sdk = []
# 默认存储后端：内嵌 Turso（持久化 config / provider 凭据 / 会话 / 历史 / 记忆）。
storage-turso = ["dep:tower-agent-turso"]
# 宿主插件能力：由 feature 决定「tower-agent 提供哪些插件」。
sandbox-wasmtime = ["dep:tower-agent-wasmtime"]
# codemode 的引擎无关宿主入口；具体解释器由下面两个子 feature 引入。
codemode = ["sandbox-wasmtime"]
# Python（monty）解释器。
codemode-python = ["codemode", "dep:tower-agent-monty"]
# JavaScript（rquickjs）解释器。
codemode-js = ["codemode", "dep:tower-agent-codemode"]

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-tools = { workspace = true }
tower-agent-plugin = { workspace = true }
tower-agent-wasmtime = { workspace = true, optional = true }
tower-agent-codemode = { workspace = true, optional = true }
tower-agent-monty = { workspace = true, optional = true }
tower-agent-protocol = { workspace = true, optional = true }
tower-agent-plugin-sdk = { workspace = true, features = ["provider"] }
tower-agent-turso = { workspace = true, optional = true }
tower-agent-ui = { workspace = true, optional = true }
tower-agent-provider-builtin.workspace = true

[dev-dependencies]
futures-util.workspace = true
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true
tower-agent-codemode-core.workspace = true
