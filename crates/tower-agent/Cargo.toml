[package]
name = "tower-agent"
description = "tower-agent: a tower-native agent framework (core + runtime + provider + tools + plugins)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# 可选前端/协议/插件 SDK。
tui = ["dep:tower-agent-tui"]
protocol = ["dep:tower-agent-protocol"]
plugin-sdk = ["dep:tower-agent-plugin-sdk"]

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-tools = { workspace = true }
tower-agent-plugins = { workspace = true }
tower-agent-tui = { workspace = true, optional = true }
tower-agent-protocol = { workspace = true, optional = true }
tower-agent-plugin-sdk = { workspace = true, optional = true }
