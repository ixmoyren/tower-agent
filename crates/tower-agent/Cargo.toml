[package]
name = "tower-agent"
description = "tower-agent: a tower-native agent framework (core + runtime + provider + tools + plugins)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = [
    "codemode",
    "jit",
    "monty",
    "rquickjs",
    "storage-turso",
]
# 可选的前端无关 UI 会话插件 / 协议 / 插件 SDK。
ui = ["dep:tower-agent-ui"]
protocol = ["dep:tower-agent-protocol"]
plugin-sdk = []
# 默认存储后端：内嵌 Turso（持久化 config / provider 凭据 / 会话 / 历史 / 记忆）。
storage-turso = ["dep:tower-agent-plugin-turso", "tower-agent-plugin-sdk/storage"]
# codemode 的引擎无关宿主入口；具体解释器由下面两个子 feature 引入。
codemode = ["tower-agent-plugin-sdk/codemode"]
# JIT 插件运行时契约。
jit = ["tower-agent-plugin-sdk/jit"]
# monty 解释器实现。
monty = ["codemode", "jit", "dep:tower-agent-plugin-monty"]
# rquickjs 解释器实现。
rquickjs = ["codemode", "jit", "dep:tower-agent-plugin-rquickjs"]

[dependencies]
tower-agent-core = { workspace = true }
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-plugin-tools = { workspace = true }
tower-agent-plugin = { workspace = true }
tower-agent-plugin-rquickjs = { workspace = true, optional = true }
tower-agent-plugin-monty = { workspace = true, optional = true }
tower-agent-protocol = { workspace = true, optional = true }
tower-agent-plugin-sdk = { workspace = true, features = ["provider"] }
tower-agent-plugin-turso = { workspace = true, optional = true }
tower-agent-ui = { workspace = true, optional = true }
tower-agent-plugin-providers.workspace = true

[dev-dependencies]
futures-util.workspace = true
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true
tower-agent-plugin-sdk = { workspace = true, features = ["codemode"] }
