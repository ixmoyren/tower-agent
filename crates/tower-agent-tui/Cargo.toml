[package]
name = "tower-agent-tui"
description = "tower-agent terminal renderer: ratatui pages and terminal input over tower-agent-plugin-ui."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ratatui = { git = "https://github.com/ratatui/ratatui.git", default-features = false, features = ["all-widgets", "termina", "layout-cache", "macros"] }
ratatui-textarea = { git = "https://github.com/ixmoyren/ratatui-textarea", default-features = false, features = ["termina", "search"] }
unicode-width = "0.2"
tokio = { workspace = true }
tower-agent-plugin-ui.workspace = true

[dev-dependencies]
serde_json.workspace = true
tower-agent-provider.workspace = true
tower-agent-runtime.workspace = true
