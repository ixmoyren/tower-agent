[package]
name = "tower-agent-tui"
description = "tower-agent TUI frontend (pi `tui`): differential terminal rendering over the agent event stream."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
tower-agent-provider = { workspace = true }
tower-agent-core = { workspace = true }
# 只被本 crate 使用。
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "termina", "layout-cache", "macros"] }
ratatui-textarea = { git = "https://github.com/ixmoyren/ratatui-textarea", default-features = false, features = ["termina"] }
unicode-width = "0.2"
serde_json = { workspace = true }
tokio = { workspace = true }
