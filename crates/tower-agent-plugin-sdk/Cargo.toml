[package]
name = "tower-agent-plugin-sdk"
description = "tower-agent plugin author SDK: declare_plugin!, HostApi handle, tool registration."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
tower-agent-plugins = { workspace = true }
semver = { workspace = true }
stabby = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tower-agent-provider.workspace = true

[features]
default = []
dynamic = ["tower-agent-plugins/dynamic", "dep:stabby", "dep:rkyv"]

[dev-dependencies]
futures-util.workspace = true
tokio.workspace = true
tower.workspace = true
