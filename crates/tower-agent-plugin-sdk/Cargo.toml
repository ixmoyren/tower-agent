[package]
name = "tower-agent-plugin-sdk"
description = "tower-agent plugin SDK: plugin macros, HostApi, tools, Provider, storage, and Wasmtime sandbox infrastructure."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tower-agent-runtime = { workspace = true }
tower-agent-plugin = { workspace = true }
semver = { workspace = true }
stabby = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tower-agent-provider = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-agent-core = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[features]
default = []
dynamic = ["tower-agent-plugin/dynamic", "dep:stabby", "dep:rkyv"]
provider = [
    "dep:tower-agent-provider",
    "dep:futures-util",
    "dep:tokio",
    "dep:tower",
]
storage = [
    "dep:tower-agent-core",
    "dep:futures-util",
    "dep:thiserror",
    "dep:tokio",
]
wasmtime = [
    "dep:dirs",
    "dep:thiserror",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
]

[dev-dependencies]
futures-util.workspace = true
tokio.workspace = true
tower.workspace = true
tower-agent-provider.workspace = true
